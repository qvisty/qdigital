<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-labelledby="t d">
  <title id="t">Sådan virker Ordstriben</title>
  <desc id="d">Forenklet animation: en boble dukker op ved et tekstfelt, der trykkes på den, ringen er grøn mens der lyttes, fyldes grønt ved en pause, bliver gul mens teksten skrives, og teksten står ved markøren.</desc>
  <style>
    /* Teksten har fast bredde (textLength), så markøren altid står lige efter den. Én gennemgang tager 11 sekunder og gentages. Uden bevægelse vises slutbilledet. */
    .a { animation-duration: 11s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .bubble { animation-name: bubble; transform-origin: 282px 262px; }
    .tap { animation-name: tap; transform-origin: 282px 262px; }
    .listen { animation-name: listen; }
    .pause { animation-name: pause; }
    .amber { animation-name: amber; }
    .type { animation-name: type; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .caret { animation-name: caret; }
    .lbl1 { animation-name: lbl1; }
    .lbl2 { animation-name: lbl2; }
    .lbl2b { animation-name: lbl2b; }
    .lbl3 { animation-name: lbl3; }
    .lbl4 { animation-name: lbl4; }
    .words { animation-name: words; }
    .waves { animation-name: waves; }
    .mic { animation-name: mic; }

    @keyframes bubble { 0%,4% { opacity: 0; transform: scale(.4); } 8%,90% { opacity: 1; transform: scale(1); } 96%,100% { opacity: 0; transform: scale(.4); } }
    @keyframes tap { 0%,10% { opacity: 0; transform: scale(.6); } 12% { opacity: .45; transform: scale(1); } 16%,100% { opacity: 0; transform: scale(1.6); } }
    @keyframes listen { 0%,15% { opacity: 0; } 16%,22% { opacity: 1; } 26% { opacity: .55; } 30% { opacity: 1; } 34% { opacity: .55; } 38%,44% { opacity: 1; } 45%,100% { opacity: 0; } }
    @keyframes pause { 0%,44% { opacity: 0; stroke-dashoffset: 163.4; } 45% { opacity: 1; stroke-dashoffset: 163.4; } 57% { opacity: 1; stroke-dashoffset: 0; } 58%,100% { opacity: 0; stroke-dashoffset: 0; } }
    @keyframes amber { 0%,57% { opacity: 0; stroke-dashoffset: 163.4; } 58% { opacity: 1; stroke-dashoffset: 160; } 72% { opacity: 1; stroke-dashoffset: 0; } 75%,100% { opacity: 0; stroke-dashoffset: 0; } }
    @keyframes type { 0%,74% { transform: scaleX(0); } 84%,94% { transform: scaleX(1); } 98%,100% { transform: scaleX(0); } }
    @keyframes caret { 0%,74% { transform: translateX(0); } 84%,94% { transform: translateX(179px); } 98%,100% { transform: translateX(0); } }
    @keyframes lbl1 { 0%,2% { opacity: 0; } 4%,14% { opacity: 1; } 16%,100% { opacity: 0; } }
    @keyframes lbl2 { 0%,15% { opacity: 0; } 17%,43% { opacity: 1; } 45%,100% { opacity: 0; } }
    @keyframes lbl2b { 0%,44% { opacity: 0; } 46%,56% { opacity: 1; } 58%,100% { opacity: 0; } }
    @keyframes lbl3 { 0%,57% { opacity: 0; } 59%,72% { opacity: 1; } 74%,100% { opacity: 0; } }
    @keyframes lbl4 { 0%,74% { opacity: 0; } 76%,93% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes words { 0%,17% { opacity: 0; } 19%,44% { opacity: 1; } 46%,100% { opacity: 0; } }
    @keyframes waves { 0%,15% { opacity: 1; } 16%,57% { opacity: 0; } 58%,100% { opacity: 1; } }
    @keyframes mic { 0%,15% { opacity: 0; } 16%,57% { opacity: 1; } 58%,100% { opacity: 0; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .blink { animation: blink 1s steps(1) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .a, .blink { animation: none; }
      .bubble { opacity: 1; }
      .tap, .listen, .pause, .amber, .lbl1, .lbl2, .lbl2b, .lbl3, .words, .mic { opacity: 0; }
      .waves { opacity: 1; }
      .type { transform: none; }
      .caret { transform: translateX(179px); }
      .lbl4 { opacity: 1; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Telefon -->
  <rect x="20" y="10" width="320" height="540" rx="36" fill="#1E3A5F"/>
  <rect x="32" y="22" width="296" height="516" rx="26" fill="#F3F8FD"/>
  <rect x="150" y="32" width="60" height="6" rx="3" fill="#C9DAEA"/>

  <!-- Mail-skærm, forenklet -->
  <text x="52" y="78" font-size="17" font-weight="700" fill="#1E3A5F">Ny mail</text>
  <rect x="48" y="96" width="264" height="36" rx="8" fill="#FFFFFF" stroke="#E1ECF7"/>
  <text x="60" y="119" font-size="13" fill="#5B7895">Til: Mette</text>
  <rect x="48" y="140" width="264" height="36" rx="8" fill="#FFFFFF" stroke="#E1ECF7"/>
  <text x="60" y="163" font-size="13" fill="#5B7895">Emne: Mødet</text>

  <!-- Tekstfeltet med fokus -->
  <rect x="48" y="186" width="264" height="150" rx="10" fill="#FFFFFF" stroke="#8DB4DA" stroke-width="2"/>
  <defs>
    <clipPath id="typed"><rect class="a type" x="58" y="196" width="181" height="40"/></clipPath>
  </defs>
  <text x="60" y="218" font-size="14" fill="#1E3A5F" textLength="176" lengthAdjust="spacingAndGlyphs" clip-path="url(#typed)">Vi ses kl. 14 i morgen. Tak!</text>
  <g class="a caret"><rect class="blink" x="60" y="205" width="2" height="17" fill="#1E3A5F"/></g>

  <!-- Tastatur, antydet -->
  <rect x="32" y="372" width="296" height="166" rx="0" fill="#E4EDF6"/>
  <g fill="#FFFFFF">
    <rect x="44" y="386" width="24" height="30" rx="5"/><rect x="72" y="386" width="24" height="30" rx="5"/><rect x="100" y="386" width="24" height="30" rx="5"/><rect x="128" y="386" width="24" height="30" rx="5"/><rect x="156" y="386" width="24" height="30" rx="5"/><rect x="184" y="386" width="24" height="30" rx="5"/><rect x="212" y="386" width="24" height="30" rx="5"/><rect x="240" y="386" width="24" height="30" rx="5"/><rect x="268" y="386" width="24" height="30" rx="5"/><rect x="296" y="386" width="20" height="30" rx="5"/>
    <rect x="56" y="424" width="24" height="30" rx="5"/><rect x="84" y="424" width="24" height="30" rx="5"/><rect x="112" y="424" width="24" height="30" rx="5"/><rect x="140" y="424" width="24" height="30" rx="5"/><rect x="168" y="424" width="24" height="30" rx="5"/><rect x="196" y="424" width="24" height="30" rx="5"/><rect x="224" y="424" width="24" height="30" rx="5"/><rect x="252" y="424" width="24" height="30" rx="5"/><rect x="280" y="424" width="24" height="30" rx="5"/>
    <rect x="96" y="462" width="168" height="30" rx="5"/>
  </g>

  <!-- Boblen ved feltet -->
  <g class="a bubble">
    <circle cx="282" cy="262" r="22" fill="#EAF3FC" stroke="#FFFFFF" stroke-width="3"/>
    <g class="a waves" fill="none" stroke-linecap="round" stroke-width="3.2">
      <path d="M 270 257 C 274 252, 278 252, 282 257 S 290 262, 294 257" stroke="#5FA8E0"/>
      <path d="M 270 266 C 274 261, 278 261, 282 266 S 290 271, 294 266" stroke="#9CCBEF"/>
    </g>
    <!-- Mikrofon, mens der lyttes -->
    <g class="a mic" opacity="0">
      <rect x="277" y="249" width="10" height="16" rx="5" fill="#2E7D32"/>
      <path d="M 272.5 260 a 9.5 9.5 0 0 0 19 0" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 282 269.5 V 275 M 277.5 275 H 286.5" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <!-- Ringe: grøn mens der lyttes, grøn nedtælling ved pause, gul mens teksten skrives -->
    <circle class="a listen" cx="282" cy="262" r="26" fill="none" stroke="#2E7D32" stroke-width="4" opacity="0"/>
    <circle class="a pause" cx="282" cy="262" r="26" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 282 262)" opacity="0"/>
    <circle class="a amber" cx="282" cy="262" r="26" fill="none" stroke="#F9A825" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 282 262)" opacity="0"/>
  </g>
  <!-- Tryk -->
  <circle class="a tap" cx="282" cy="262" r="30" fill="#1E3A5F" opacity="0"/>

  <!-- Talt tekst som taleboble med spids ned mod den, der taler -->
  <g class="a words" opacity="0">
    <path d="M 87 282 H 229 A 17 17 0 0 1 246 299 A 17 17 0 0 1 229 316 H 112 L 92 332 L 98 316 H 87 A 17 17 0 0 1 70 299 A 17 17 0 0 1 87 282 Z" fill="#EAF3FC" stroke="#C9DAEA" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="158" y="304" font-size="13" fill="#1E3A5F" text-anchor="middle">“Vi ses klokken 14 …”</text>
  </g>

  <!-- Trinforklaring under telefonen er på siden. Kort status her: -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text class="a lbl1" x="180" y="356" fill="#1E3A5F" opacity="0">1. Tryk på boblen</text>
    <text class="a lbl2" x="180" y="356" fill="#2E7D32" opacity="0">2. Tal dansk. Ringen er grøn</text>
    <text class="a lbl2b" x="180" y="356" fill="#2E7D32" opacity="0">Pause: ringen fyldes grønt</text>
    <text class="a lbl3" x="180" y="356" fill="#B7791F" opacity="0">3. Gul ring: teksten skrives</text>
    <text class="a lbl4" x="180" y="356" fill="#1E3A5F" opacity="0">Teksten står ved markøren</text>
  </g>
</svg>
