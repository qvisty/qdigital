# Sender hjemmesiden til Simply.com over FTPS, hver gang main ændres.
# Kræver tre hemmeligheder i GitHub: FTP_SERVER, FTP_USERNAME og FTP_PASSWORD.
# Indtil de findes, springes udgivelsen over.
name: Udgiv til Simply

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-simply
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Hent koden
        if: env.HAS_FTP == 'true'
        uses: actions/checkout@v4

      - name: Skriv konfiguration til feedback
        if: env.HAS_FTP == 'true'
        env:
          FEEDBACK_SMTP_PASSWORD: ${{ secrets.FEEDBACK_SMTP_PASSWORD }}
        run: |
          # api/feedback.php sender mails via Simplys SMTP som noreply@qdigital.dk.
          # Uden hemmeligheden svarer scriptet blot "Not configured".
          if [ -n "$FEEDBACK_SMTP_PASSWORD" ]; then
            php -r 'file_put_contents("api/config.php", "<?php return " . var_export([
              "smtp_host" => "websmtp.simply.com",
              "smtp_user" => "noreply@qdigital.dk",
              "smtp_pass" => getenv("FEEDBACK_SMTP_PASSWORD"),
              "to" => "apps@qdigital.dk",
            ], true) . ";\n");'
          fi

      - name: Upload til Simply
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            design/**
            README.md
            .nojekyll

      - name: Skriv konfiguration til Truckspotting forslag
        if: env.HAS_FTP == 'true'
        env:
          FEEDBACK_SMTP_PASSWORD: ${{ secrets.FEEDBACK_SMTP_PASSWORD }}
          TRUCKSPOTTING_ADMIN_HASH: ${{ secrets.TRUCKSPOTTING_ADMIN_HASH }}
          TRUCKSPOTTING_API_HASH: ${{ secrets.TRUCKSPOTTING_API_HASH }}
        run: |
          # truckspotting/forslag/index.php og behandl/index.php læser config.php fra truckspotting-data ved siden af public_html.
          # Mailen bruger samme postkasse som feedback. admin_hash er adgangskoden til siden behandl, gemt som hash.
          # api_hash er hashen af nøglen til siden behandls JSON adgang.
          # Filen skrives uden for repoet og kommer aldrig i public_html.
          mkdir -p "$RUNNER_TEMP/truckspotting-data"
          php -r '
            $cfg = [];
            if ((string) getenv("FEEDBACK_SMTP_PASSWORD") !== "") {
              $cfg += ["host" => "websmtp.simply.com", "user" => "noreply@qdigital.dk",
                       "pass" => getenv("FEEDBACK_SMTP_PASSWORD"), "to" => "kontakt@qdigital.dk"];
            }
            $hash = trim((string) getenv("TRUCKSPOTTING_ADMIN_HASH"));
            if ($hash !== "") $cfg["admin_hash"] = $hash;
            $api = trim((string) getenv("TRUCKSPOTTING_API_HASH"));
            if ($api !== "") $cfg["api_hash"] = $api;
            if ($cfg) file_put_contents(getenv("RUNNER_TEMP") . "/truckspotting-data/config.php", "<?php return " . var_export($cfg, true) . ";\n");
          '

      - name: Upload konfiguration til Truckspotting forslag
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ runner.temp }}/truckspotting-data/
          server-dir: truckspotting-data/

      - name: Ingen FTP oplysninger endnu
        if: env.HAS_FTP != 'true'
        run: echo "FTP hemmelighederne mangler, så der er ikke udgivet noget."
