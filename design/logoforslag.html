<!doctype html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logoforslag</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo/ikon.svg" type="image/svg+xml">
<style>
:root{--g:#007A53;--ink:#13221C;--bg:#eef2f0;--card:#fff;--line:#dde5e1}
@media (prefers-color-scheme: dark){:root{--g:#1f9e70;--ink:#e8efec;--bg:#0f1a16;--card:#16241f;--line:#24362f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding:16px}
main{max-width:440px;margin:0 auto}
h1{font-size:20px;margin:4px 0 6px}
h2{font-size:16px;margin:26px 0 10px}
p.lead{margin:0 0 16px;opacity:.75}
.card{background:var(--card);border-radius:14px;margin:0 0 14px;overflow:hidden;border:1px solid var(--line)}
.art{height:130px;display:flex;align-items:center;justify-content:center}
.cap{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.cap span{flex:1}
.cap b{color:var(--g)}
svg{max-width:100%;overflow:visible}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;fill:var(--ink)}
.g{fill:var(--g)} .gs{stroke:var(--g)} .k{fill:var(--ink)} .cut{stroke:var(--card)}
button{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--g);background:transparent;color:var(--g);cursor:pointer}
#all{display:block;width:100%;margin:0 0 6px;padding:10px;background:var(--g);color:#fff;font-weight:600;border:0}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes type{from{width:0}to{width:160px}}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(146px)}}

.anim .ring{stroke-dasharray:158;stroke-dashoffset:158;animation:draw .9s ease-out forwards}
.anim .tail{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .3s ease-out .9s forwards}
.anim .txt{opacity:0;animation:fade .5s ease-out .9s forwards}
.anim .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s ease-out forwards}
.a1 .q{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .6s ease-out forwards}
.a1 .rest{opacity:0;animation:slide .6s ease-out .45s forwards}
.a3 .tail{animation:draw .3s ease-out .9s forwards,pulse 1.1s ease-in-out 1.4s infinite}
.a5 .px{opacity:0;animation:fade .12s linear forwards}
.a6 .chev{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .4s ease-out forwards}
.a6 .clip{animation:type 1.2s steps(9) .5s forwards}
.a6 .cur{animation:move 1.2s steps(9) .5s forwards,blink 1s steps(1) 1.7s infinite}
</style></head><body><main>
<h1>Logoforslag til Q Digital</h1>
<p class="lead">Alle ringene har nu en tydelig hale nederst til højre, så de læses som Q og ikke som O. Pixelforslagene følger et klassisk pixel Q.</p>

<h2>Uden animation</h2>
<div id="static"></div>

<h2>Animeret</h2>
<button id="all" onclick="document.querySelectorAll('.anim').forEach(replay)">Afspil alle</button>
<div id="moving"></div>
</main>

<script>
const NAME = '<text class="txt" x="84" y="52" font-size="34">Q Digital</text>';
const RING = '<circle class="ring gs" cx="38" cy="38" r="25" fill="none" stroke-width="9" transform="rotate(45 38 38)"/>';
const TAIL = '<line class="tail gs" x1="50" y1="50" x2="66" y2="66" stroke-width="9" stroke-linecap="round"/>';

// Pixel Q: en ring på 5 gange 5 med afskårne hjørner og en skrå hale på 3 pixels,
// der starter inde i ringen og stikker ud nederst til højre.
const RINGPX = [[1,0],[2,0],[3,0],[4,1],[4,2],[4,3],[3,4],[2,4],[1,4],[0,3],[0,2],[0,1]];
const TAILPX = [[3,3],[4,4],[5,5]];
function pixelQ(black, animated){
  let out = '', i = 0;
  [...RINGPX, ...TAILPX].forEach(([c, r]) => {
    const isBlack = black.some(([bc, br]) => bc === c && br === r);
    const delay = animated ? ` style="animation-delay:${(i++ * 0.08).toFixed(2)}s"` : '';
    out += `<rect class="${animated ? 'px ' : ''}${isBlack ? 'k' : 'g'}"${delay} x="${4 + c * 13}" y="${1 + r * 13}" width="11" height="11" rx="1"/>`;
  });
  return out;
}
const PXNAME = '<text class="txt" x="84" y="52" font-size="34">Q Digital</text>';

const STATIC = [
  ['1. Ordmærke', 'Q i grøn, resten i mørk tekst. Det er udgangspunktet for siden.',
   '<svg width="300" height="70" viewBox="0 0 300 70"><text class="g" x="0" y="50" font-size="46" style="font-weight:800">Q</text><text x="48" y="50" font-size="46">Digital</text></svg>'],
  ['2. Appikon', 'Hvidt Q i et grønt afrundet kvadrat.',
   '<svg width="300" height="80" viewBox="0 0 300 80"><rect class="g" x="4" y="8" width="64" height="64" rx="16"/><text x="36" y="56" text-anchor="middle" font-size="44" style="fill:#fff;font-weight:800">Q</text><text x="84" y="54" font-size="34">Q Digital</text></svg>'],
  ['3. Markør', 'Halen er en markør, der skærer skråt gennem ringen.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}<line class="gs" x1="50" y1="50" x2="68" y2="68" stroke-width="9"/>${NAME}</svg>`],
  ['4. Prik', 'Skrå hale, der ender i en sort prik.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}<line class="gs" x1="50" y1="50" x2="60" y2="60" stroke-width="9" stroke-linecap="round"/><circle class="k" cx="66" cy="66" r="7"/>${NAME}</svg>`],
  ['4A. Prik inde', 'Grøn hale gennem ringen og en sort prik på indersiden, hvor halen starter.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}${TAIL}<circle class="k" cx="47" cy="47" r="6"/>${NAME}</svg>`],
  ['4C. To prikker', 'Skrå hale med en sort prik i hver ende, en inde og en ude.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}<line class="gs" x1="50" y1="50" x2="60" y2="60" stroke-width="9" stroke-linecap="round"/><circle class="k" cx="47" cy="47" r="6"/><circle class="k" cx="66" cy="66" r="7"/>${NAME}</svg>`],
  ['5. Pixel', 'Pixelring med en skrå hale, der stikker ud. Den yderste pixel er sort.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${pixelQ([[5,5]])}${PXNAME}</svg>`],
  ['5A. Pixel med prik inde', 'Den inderste pixel på halen er sort.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${pixelQ([[3,3]])}${PXNAME}</svg>`],
  ['5B. Pixel med sort hale', 'Hele halen er sort, både inde og ude.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${pixelQ([[3,3],[4,4],[5,5]])}${PXNAME}</svg>`],
  ['5C. Pixel med to prikker', 'Den inderste og den yderste pixel er sorte.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${pixelQ([[3,3],[5,5]])}${PXNAME}</svg>`],
  ['6. Prompt', 'Terminaltegn foran navnet og en markør bagefter. Her er Q et bogstav i navnet.',
   '<svg width="300" height="80" viewBox="0 0 300 80"><path class="gs" d="M10 14 L34 38 L10 62" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="54" font-size="34">Q Digital</text><rect class="g" x="192" y="56" width="18" height="5"/></svg>'],
  ['7. Klassisk', 'Ring med skrå hale og navnet stablet.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}<line class="gs" x1="48" y1="48" x2="66" y2="66" stroke-width="9" stroke-linecap="round"/><text x="84" y="40" font-size="26" style="font-weight:800;letter-spacing:1px">Q</text><text class="g" x="84" y="64" font-size="18" style="letter-spacing:4px">DIGITAL</text></svg>`],
  ['8. Domæne', 'Navnet med småt og en grøn prik. Q er her et lille q.',
   '<svg width="300" height="70" viewBox="0 0 300 70"><text x="0" y="48" font-size="42" style="letter-spacing:-1.5px">qdigital</text><circle class="g" cx="149" cy="44" r="6"/></svg>'],
  ['9. Monogram', 'QD i en grøn cirkel.',
   '<svg width="300" height="80" viewBox="0 0 300 80"><circle class="g" cx="36" cy="40" r="32"/><text x="36" y="51" text-anchor="middle" font-size="30" style="fill:#fff;font-weight:800;letter-spacing:-1px">QD</text><text x="84" y="54" font-size="34">Q Digital</text></svg>'],
];

const MOVING = [
  ['a1', '1. Ordmærke', 'Q popper frem, og resten glider ind.',
   '<svg width="300" height="70" viewBox="0 0 300 70"><text class="q g" x="0" y="50" font-size="46" style="font-weight:800">Q</text><text class="rest" x="48" y="50" font-size="46">Digital</text></svg>'],
  ['a3', '3. Markør', 'Ringen tegnes, og halen pulserer som en markør. Den forsvinder aldrig helt, så det altid er et Q.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}<line class="tail gs" x1="50" y1="50" x2="68" y2="68" stroke-width="9"/>${NAME}</svg>`],
  ['a4', '4A. Prik inde', 'Ringen tegnes, halen skærer igennem, og prikken popper frem.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}${TAIL}<circle class="pop k" style="animation-delay:1.2s" cx="47" cy="47" r="6"/>${NAME}</svg>`],
  ['a4c', '4C. To prikker', 'Ringen og halen tegnes, og de to prikker popper frem efter hinanden.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${RING}<line class="tail gs" x1="50" y1="50" x2="60" y2="60" stroke-width="9" stroke-linecap="round"/><circle class="pop k" style="animation-delay:1.2s" cx="47" cy="47" r="6"/><circle class="pop k" style="animation-delay:1.4s" cx="66" cy="66" r="7"/>${NAME}</svg>`],
  ['a5', '5A. Pixel', 'Ringen bygges pixel for pixel, og halen kommer til sidst.',
   `<svg width="300" height="80" viewBox="0 0 300 80">${pixelQ([[3,3]], true)}<text class="txt" style="animation-delay:1.2s" x="84" y="52" font-size="34">Q Digital</text></svg>`],
  ['a6', '6. Prompt', 'Navnet skrives bogstav for bogstav, og markøren blinker.',
   '<svg width="300" height="80" viewBox="0 0 300 80"><defs><clipPath id="c6"><rect class="clip" x="44" y="0" width="0" height="80"/></clipPath></defs><path class="chev gs" d="M10 14 L34 38 L10 62" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text clip-path="url(#c6)" x="46" y="54" font-size="34">Q Digital</text><rect class="cur g" x="46" y="56" width="18" height="5"/></svg>'],
];

document.getElementById('static').innerHTML = STATIC.map(([t, d, s]) =>
  `<div class="card"><div class="art">${s}</div><div class="cap"><span><b>${t}.</b> ${d}</span></div></div>`).join('');
document.getElementById('moving').innerHTML = MOVING.map(([c, t, d, s]) =>
  `<div class="card anim ${c}"><div class="art">${s}</div><div class="cap"><span><b>${t}.</b> ${d}</span><button onclick="replay(this.closest('.card'))">Afspil</button></div></div>`).join('');

function replay(card){ const s = card.querySelector('svg'); s.replaceWith(s.cloneNode(true)); }
</script>
</body></html>
